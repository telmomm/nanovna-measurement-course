name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lessons and worked solutions are all executed, in English and in Spanish
# (es/). Notebook 04 drives a physical NanoVNA and cannot run on a CI runner.
env:
  NBMAKE_ARGS: >-
    --nbmake notebooks exercises es
    --ignore=notebooks/04_adquisicion_nanovna.ipynb
    --ignore=es/notebooks/04_adquisicion_nanovna.ipynb

jobs:
  notebooks:
    name: notebooks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

      - name: Execute notebooks
        run: pytest $NBMAKE_ARGS

  binder-env:
    name: notebooks (Binder environment)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Create environment from environment.yml
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Run postBuild
        run: bash postBuild

      - name: Execute notebooks
        run: pytest $NBMAKE_ARGS
