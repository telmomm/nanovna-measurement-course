name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # IBM Plex for the figures, rsvg-convert for the SVG badges in the PDF.
      - name: Install fonts and tools
        run: sudo apt-get update && sudo apt-get install -y fonts-ibm-plex librsvg2-bin

      # A current TeX Live: the PDF style needs IBM Plex Sans, Mono and Math.
      - name: Set up TeX Live
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: >-
            scheme-basic
            xetex latexmk
            plex fontspec unicode-math ucharclasses newunicodechar
            titlesec fancyhdr pgf xcolor
            babel-english babel-spanish hyphen-spanish
            fncychap tabulary varwidth framed wrapfig capt-of needspace upquote
            float parskip etoolbox geometry hyperref oberdiek
            amsmath amsfonts booktabs multirow cmap
            fancyvrb ltxcmds kvoptions tools

      - name: Install package with book extras
        run: python -m pip install -e ".[book]"

      # Both editions, HTML and PDF, assembled in _site/. The HTML builds use -W,
      # so a warning (such as a broken link) fails the job.
      - name: Build the books
        run: tools/build_book.sh

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Needs GitHub Pages enabled with "GitHub Actions" as its source
  # (repository Settings > Pages).
  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
