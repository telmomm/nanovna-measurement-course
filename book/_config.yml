# Jupyter Book 1.x configuration.
#
# The book is built from the repository root, so that it uses the notebooks
# and Markdown files where they already live instead of copies:
#
#   jupyter-book build . --config book/_config.yml --toc book/_toc.yml --path-output book
#
# The site is written to book/_build/html.

title: Hands-on vector network analysis with a NanoVNA
author: Telmo Miguel-Medina
copyright: "2026"

# The notebooks are stored without outputs; run them when the book is built.
execute:
  execute_notebooks: force
  timeout: 300
  allow_errors: false

only_build_toc_files: true
exclude_patterns:
  - "book/_build"
  - "_preview"
  - ".venv"
  - "venv"
  - ".pytest_cache"
  - ".ruff_cache"
  - "**/.ipynb_checkpoints"

repository:
  url: https://github.com/telmomm/nanovna-measurement-course
  branch: main
  path_to_book: ""

launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: https://mybinder.org
  colab_url: https://colab.research.google.com

html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: false
  home_page_in_navbar: false

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - html_image

sphinx:
  config:
    html_show_copyright: false
    # GitHub-style anchors for headings, so that links such as
    # guia_docente.md#9-summative-assessment work in the book too.
    myst_heading_anchors: 3
    nb_merge_streams: true
